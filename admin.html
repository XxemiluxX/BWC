<!DOCTYPE html>
<html lang="es">
<head>

<body class="admin-page">
  <aside class="admin-sidebar">
    <a class="brand" href="admin.html"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="bwcGrad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#3d8b63"/><stop offset="1" stop-color="#173d2c"/></linearGradient></defs><rect width="40" height="40" rx="11" fill="url(#bwcGrad)"/><path d="M20 8c-6.4 3-9.8 8.1-9.8 13.1A9.8 9.8 0 0 0 20 30.9a9.8 9.8 0 0 0 9.8-9.8C29.8 16.1 26.4 11 20 8Z" fill="#eaf7ef"/><path d="M20 12.4c-3.8 2.3-5.7 5.7-5.7 9.1" stroke="#2f8a61" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg></span><span>Better World <strong>Challenge</strong></span></a>
    <div class="admin-label">MODERACIÓN</div>
    <nav id="adminNav">
      <button class="admin-nav-btn active" data-view="dashboard">📊 <span>Dashboard</span></button>
      <button class="admin-nav-btn" data-view="users">👥 <span>Usuarios</span></button>
      <button class="admin-nav-btn" data-view="evidence">📷 <span>Evidencias</span><span id="pendingNavCount" class="nav-count">0</span></button>
      <button class="admin-nav-btn" data-view="activity">📜 <span>Actividad</span></button>
      <button class="admin-nav-btn" data-view="completed">🏆 <span>Completados</span></button>
      <button class="admin-nav-btn" data-view="settings">⚙️ <span>Configuración</span></button>
    </nav>
    <div class="admin-side-bottom">
      <div class="demo-pill">FIREBASE · EN VIVO</div>
      <button id="adminLogoutBtn" class="btn btn-soft btn-full">Cerrar sesión</button>
    </div>
  </aside>

  <main class="admin-content">
    <header class="admin-topbar">
      <div><span class="eyebrow">PANEL DE MODERACIÓN</span><h1>Better World Challenge</h1></div>
      <div class="admin-top-actions"><button class="theme-toggle" data-theme-toggle type="button" aria-label="Activar modo oscuro">🌙</button><div class="moderator-chip"><span class="avatar" id="adminAvatar">M</span><div><b id="adminUserName">Moderador</b><small id="adminUserEmail">Firebase</small></div></div></div>
    </header>

    <div id="adminViewRoot"></div>
  </main>

  <div id="adminModalRoot"></div>
  <div id="toastRoot" class="toast-root"></div>
  <script type="module" src="js/admin.js"></script>
